[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uc28-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.30.*",
    "sqlalchemy==2.0.*",
    "alembic==1.13.*",
    "pydantic==2.9.*",
    "pydantic-settings==2.5.*",
    "psycopg[binary]==3.2.*",
    "anthropic==0.40.*",
    "chromadb==0.5.*",
    "sentence-transformers==3.1.*",
    "python-docx==1.1.*",
    "python-multipart==0.0.12",
    "python-dotenv==1.0.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "pytest-asyncio==0.24.*",
    "httpx==0.27.*",
    "ruff==0.6.*",
]

[tool.uv]
dev-dependencies = [
    "pytest==8.*",
    "pytest-asyncio==0.24.*",
    "httpx==0.27.*",
    "ruff==0.6.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
