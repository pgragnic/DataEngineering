name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # ─── Backend : Lambda via SAM ───────────────────────────────────────────────
  deploy-backend:
    name: Backend (Lambda + API Gateway)
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.sam-deploy.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-west-1

      - name: SAM Build
        working-directory: etoro
        run: sam build

      - name: SAM Deploy
        id: sam-deploy
        working-directory: etoro
        run: |
          sam deploy \
            --parameter-overrides \
              EtoroAgentKey="${{ secrets.ETORO_AGENT_KEY }}" \
              EtoroApiKey="${{ secrets.ETORO_API_KEY }}" \
              EtoroInvestment="${{ vars.ETORO_INVESTMENT }}" \
              AllowedOrigin="https://${{ vars.CLOUDFRONT_DOMAIN }}"
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name etoro-portfolio \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT

  # ─── Frontend : React → S3 + CloudFront ─────────────────────────────────────
  deploy-frontend:
    name: Frontend (React → S3)
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: etoro-react/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-west-1

      - name: Build React
        working-directory: etoro-react
        env:
          VITE_API_URL: ${{ needs.deploy-backend.outputs.api_url }}
        run: |
          npm ci
          npm run build

      - name: Sync vers S3
        run: |
          aws s3 sync etoro-react/dist/ s3://${{ vars.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html"
          aws s3 cp etoro-react/dist/index.html s3://${{ vars.S3_BUCKET }}/index.html \
            --cache-control "no-cache"

      - name: Invalider CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_ID }} \
            --paths "/*"
