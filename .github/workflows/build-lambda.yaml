name: Build Lambda ZIP

on:
  push:
    branches: ["main", "claude/review-etoro-skills-jUgAB"]
    paths:
      - "etoro/lambda_app.py"
      - "etoro/requirements.txt"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r etoro/requirements.txt -t etoro/.package --quiet

      - name: Package Lambda ZIP
        run: |
          cp etoro/lambda_app.py etoro/.package/app.py
          cd etoro/.package
          zip -r ../lambda.zip . -x "*.pyc" -x "*/__pycache__/*"
          echo "ZIP size: $(du -sh ../lambda.zip | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-${{ github.sha }}
          path: etoro/lambda.zip
          retention-days: 30
